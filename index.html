<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flatbed Scanner</title>
<meta name="description" content="Scan documents with your camera, pull out the text, sign, and export PDFs. Works offline.">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flatbed">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
/* Layout idea: a phone-first scanner — paper-grey library, ultramarine "scan beam" accent,
   and a fixed dark capture/edit studio that sits on top like a camera UI. */
:root {
  --paper: #eef0ec;
  --sheet: #ffffff;
  --ink: #14171a;
  --ink-2: #5a6068;
  --rule: #d8dcd8;
  --accent: #2a44f0;
  --accent-ink: #ffffff;
  --accent-soft: #e3e7ff;
  --marker: #ffd93b;
  --ok: #17825a;
  --danger: #c8362b;
  --shadow: 0 1px 2px rgba(20, 23, 26, .06), 0 6px 18px rgba(20, 23, 26, .06);
  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1113; --sheet: #191c20; --ink: #eceef0; --ink-2: #9aa1a9; --rule: #2b3036;
    --accent: #8d9bff; --accent-ink: #0b0f2e; --accent-soft: #232a52; --ok: #4cc38a; --danger: #ff6b5e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1113; --sheet: #191c20; --ink: #eceef0; --ink-2: #9aa1a9; --rule: #2b3036;
  --accent: #8d9bff; --accent-ink: #0b0f2e; --accent-soft: #232a52; --ok: #4cc38a; --danger: #ff6b5e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.mono, .meta { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- App shell ---------- */
#app { height: 100%; display: flex; flex-direction: column; }
#view { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 24px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 max(16px, var(--safe-l)) 0 max(16px, var(--safe-r)); }

.appbar {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding-top: var(--safe-t);
}
.appbar-in { display: flex; align-items: center; gap: 8px; min-height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.brand-mark svg { width: 20px; height: 20px; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; }
.icon-btn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: var(--ink); flex: none; }
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.cloud-chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 10px; border-radius: 99px; border: 1px solid var(--rule); background: var(--sheet); font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.cloud-chip .ic { width: 18px; height: 18px; }
.cloud-chip.ok { color: var(--ok); }
.cloud-chip.warn { color: var(--danger); }
.cloud-chip.busy .ic { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.search { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border-radius: 14px; background: var(--sheet); border: 1px solid var(--rule); color: var(--ink-2); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 16px; }
.search:focus-within { border-color: var(--accent); }

.quick { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin: 14px 0 4px; }
.quick button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 2px 8px; border-radius: 14px; background: var(--sheet); border: 1px solid var(--rule); font-size: 12px; color: var(--ink); line-height: 1.15; text-align: center; }
.quick button .ic { color: var(--accent); }
.quick button:hover { border-color: var(--accent); }
@media (max-width: 480px) { .quick { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.install-card { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px 12px 12px 14px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.install-card img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
.install-card .grow { flex: 1; min-width: 0; }
.install-card b { display: block; font-size: 15px; }
.install-card small { display: block; color: var(--ink-2); font-size: 13px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--rule); background: var(--sheet); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip .ic { width: 16px; height: 16px; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip .count { font-family: var(--font-mono); font-size: 12px; opacity: .7; }

.list-head { display: flex; align-items: center; gap: 4px; margin: 12px 0 8px; color: var(--ink-2); font-size: 13px; }
.list-head .grow { flex: 1; }
.list-head .icon-btn { width: 36px; height: 36px; color: var(--ink-2); }
.list-head .ic { width: 20px; height: 20px; }

/* ---------- Document list ---------- */
.doc-list { display: grid; gap: 10px; }
.doc-card { display: flex; gap: 14px; align-items: center; padding: 10px; padding-right: 4px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); cursor: pointer; text-align: left; width: 100%; }
.doc-card:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--rule)); }
.doc-thumb { position: relative; width: 62px; height: 80px; flex: none; border-radius: 6px; overflow: hidden; background: var(--paper); box-shadow: 0 0 0 1px var(--rule); }
.doc-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.pp-badge { position: absolute; right: 4px; bottom: 4px; font-family: var(--font-mono); font-size: 11px; padding: 1px 5px; border-radius: 5px; background: rgba(20, 23, 26, .78); color: #fff; }
.doc-info { flex: 1; min-width: 0; display: grid; gap: 3px; }
.doc-info h3 { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-info .meta { font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 11px; line-height: 19px; font-family: var(--font-body); font-weight: 600; }
.tag-sample { background: color-mix(in srgb, var(--marker) 45%, transparent); color: var(--ink); }
.star-on { color: #e0a400; }
.star-on .ic { fill: currentColor; width: 14px; height: 14px; }
.snippet { font-size: 13px; color: var(--ink-2); margin: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.snippet mark { background: color-mix(in srgb, var(--marker) 70%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

.doc-list.grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.doc-list.grid .doc-card { flex-direction: column; align-items: stretch; padding: 8px; gap: 8px; position: relative; }
.doc-list.grid .doc-thumb { width: 100%; height: auto; aspect-ratio: 3 / 4; }
.doc-list.grid .doc-card > .icon-btn { position: absolute; top: 10px; right: 10px; background: color-mix(in srgb, var(--sheet) 85%, transparent); width: 34px; height: 34px; }
.doc-list.grid .snippet { display: none; }

.empty { text-align: center; padding: 48px 16px; color: var(--ink-2); display: grid; justify-items: center; gap: 12px; }
.empty-art { width: 120px; height: 120px; }
.empty h2 { color: var(--ink); font-size: 22px; }
.empty p { margin: 0; max-width: 34ch; }

/* ---------- Tabbar ---------- */
.tabbar {
  display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: end;
  background: var(--sheet); border-top: 1px solid var(--rule);
  padding: 6px max(8px, var(--safe-l)) calc(6px + var(--safe-b)) max(8px, var(--safe-r));
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11.5px; color: var(--ink-2); border-radius: 10px; }
.tab.on { color: var(--accent); }
.tab-scan { justify-self: center; width: 64px; height: 64px; border-radius: 22px; margin-top: -26px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 45%, transparent); }
.tab-scan .ic { width: 30px; height: 30px; stroke-width: 1.9; }

/* ---------- Generic controls ---------- */
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--rule); background: var(--sheet); font-weight: 600; font-size: 15px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn .ic { width: 20px; height: 20px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.08); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.input, .select { width: 100%; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font-size: 16px; }
textarea.input { height: auto; padding: 10px 12px; line-height: 1.5; resize: vertical; }
.input:focus, .select:focus { outline: none; border-color: var(--accent); }
.field { display: grid; gap: 6px; }
.field-label { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.field-label:empty { display: none; }
.row { display: flex; gap: 10px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--sheet); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.seg button .ic { width: 18px; height: 18px; }
.seg button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; inset: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--rule); transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* ---------- Sections (tools, settings) ---------- */
.page-title { font-size: 28px; font-weight: 800; padding: 8px 0 4px; }
.section { margin-top: 22px; }
.section-title { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 0 0 10px; font-weight: 500; }
.tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tool { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border-radius: var(--r); background: var(--sheet); border: 1px solid var(--rule); text-align: left; min-height: 104px; }
.tool:hover { border-color: var(--accent); }
.tool-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.tool b { font-size: 14.5px; line-height: 1.25; }
.tool small { color: var(--ink-2); font-size: 12.5px; line-height: 1.3; margin-top: -6px; }
.tool.ai .tool-ic { background: color-mix(in srgb, var(--marker) 40%, transparent); color: var(--ink); }

.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--rule); min-height: 56px; }
.set-row:first-child { border-top: 0; }
.set-row .grow { flex: 1; min-width: 0; }
.set-row b { display: block; font-weight: 600; font-size: 15px; }
.set-row small { display: block; color: var(--ink-2); font-size: 13px; }
.set-row .select { width: auto; max-width: 52%; height: 38px; font-size: 14px; }
.set-row .ic.lead { color: var(--ink-2); }
.meter { height: 6px; border-radius: 9px; background: var(--rule); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--accent); }

/* ---------- Signatures ---------- */
.sig-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.sig-card { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px; }
.sig-img { height: 110px; border-radius: 8px; display: grid; place-items: center; background: #fff; background-image: linear-gradient(45deg, #f1f1f1 25%, transparent 25%), linear-gradient(-45deg, #f1f1f1 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f1f1f1 75%), linear-gradient(-45deg, transparent 75%, #f1f1f1 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
.sig-img img { max-width: 92%; max-height: 92px; }
.sig-card .icon-btn { position: absolute; top: 6px; right: 6px; }
.sigpad-wrap { position: relative; border-radius: 12px; background: #fff; border: 1px solid var(--rule); touch-action: none; }
.sigpad-wrap canvas { display: block; width: 100%; height: 220px; touch-action: none; cursor: crosshair; }
.sigpad-line { position: absolute; left: 24px; right: 24px; bottom: 46px; border-top: 1.5px dashed #c5c9cf; pointer-events: none; }
.sigpad-hint { position: absolute; left: 24px; bottom: 22px; font-size: 12px; color: #8a9098; pointer-events: none; font-family: var(--font-mono); }
.swatches { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); }
.swatch.on { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Document view ---------- */
.doc-head { display: flex; align-items: center; gap: 6px; min-height: 58px; }
.doc-title { flex: 1; min-width: 0; text-align: left; padding: 4px 6px; border-radius: 10px; }
.doc-title:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.doc-title h1 { font-size: 19px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-title .meta { font-size: 12px; color: var(--ink-2); }
.page-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; padding: 10px 0 120px; }
@media (max-width: 420px) { .page-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.page-tile { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 8px; background: var(--sheet); box-shadow: var(--shadow), 0 0 0 1px var(--rule); overflow: hidden; }
.page-tile img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
.pg-num { position: absolute; left: 6px; bottom: 6px; font-size: 11px; padding: 1px 6px; border-radius: 5px; background: rgba(20, 23, 26, .78); color: #fff; font-family: var(--font-mono); }
.pg-flags { position: absolute; right: 6px; bottom: 6px; display: flex; gap: 4px; }
.pg-flags span { font-size: 10px; padding: 1px 5px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); }
.page-tile.sel { box-shadow: 0 0 0 3px var(--accent); }
.page-tile .check { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: rgba(20, 23, 26, .35); display: grid; place-items: center; color: #fff; }
.page-tile.sel .check { background: var(--accent); border-color: var(--accent); }
.page-tile .check .ic { width: 16px; height: 16px; stroke-width: 2.6; }
.page-add { display: grid; place-items: center; align-content: center; gap: 8px; aspect-ratio: 3 / 4; border-radius: 8px; border: 1.5px dashed var(--rule); color: var(--ink-2); font-size: 14px; }
.page-add:hover { border-color: var(--accent); color: var(--accent); }
.reorder { position: absolute; inset: auto 0 0 0; display: flex; justify-content: space-between; padding: 6px; }
.reorder button { width: 36px; height: 36px; border-radius: 10px; background: rgba(20, 23, 26, .82); color: #fff; display: grid; place-items: center; }
.selbar { position: sticky; top: calc(58px + var(--safe-t)); z-index: 4; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 12px; background: var(--ink); color: var(--paper); margin-bottom: 6px; }
.selbar .grow { flex: 1; font-weight: 600; }
.selbar button { color: var(--paper); height: 36px; padding: 0 10px; border-radius: 9px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.selbar button:hover { background: rgba(255, 255, 255, .12); }
.selbar .ic { width: 18px; height: 18px; }
.selbar .grow { white-space: nowrap; }
@media (max-width: 520px) { .selbar button span { display: none; } .selbar button { padding: 0 9px; } }

.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center;
  padding: 8px max(10px, var(--safe-l)) calc(8px + var(--safe-b)) max(10px, var(--safe-r));
  background: var(--sheet); border-top: 1px solid var(--rule);
}
.actionbar-in { display: flex; gap: 2px; width: 100%; max-width: 640px; justify-content: space-between; }
.act { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 10px; font-size: 11.5px; color: var(--ink); min-width: 0; }
.act:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.act .ic { color: var(--accent); }

/* ---------- Sheets ---------- */
#sheet-root { position: relative; z-index: 50; }
.sheet-backdrop { position: fixed; inset: 0; background: rgba(10, 12, 14, .48); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .18s; }
.sheet-backdrop.in { opacity: 1; }
.sheet-backdrop.out { opacity: 0; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; display: flex; flex-direction: column; background: var(--sheet); color: var(--ink); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .2); transform: translateY(24px); transition: transform .2s; padding-bottom: var(--safe-b); }
.sheet-backdrop.in .sheet { transform: none; }
.sheet-wide { max-width: 760px; }

// ------------------------------- Toasts ------------------------------------
function toast(msg, opts = {}) {
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast' + (opts.type ? ' toast-' + opts.type : '');
  el.setAttribute('role', opts.type === 'err' ? 'alert' : 'status');
  el.innerHTML = `<span>${esc(msg)}</span>` + (opts.action ? `<button class="toast-btn">${esc(opts.action.label)}</button>` : '');

// ------------------------------- Sheets ------------------------------------
const sheetStack = [];
function openSheet({ title, body = '', actions = [], cls = '', onClose, wide = false }) {
  const root = $('#sheet-root');
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  const tid = 'st-' + uid();
  wrap.innerHTML = `<div class="sheet ${wide ? 'sheet-wide' : ''} ${cls}" role="dialog" aria-modal="true" aria-labelledby="${tid}">
    <header class="sheet-head"><h2 id="${tid}">${esc(title || '')}</h2><button class="icon-btn sheet-x" aria-label="Close">${ic('x')}</button></header>
    <div class="sheet-body">${body}</div>
    ${actions.length ? `<footer class="sheet-foot">${actions.map((a, i) => `<button class="btn ${a.primary ? 'btn-primary' : ''} ${a.danger ? 'btn-danger' : ''}" data-i="${i}" ${a.id ? `id="${a.id}"` : ''}>${a.icon ? ic(a.icon) : ''}<span>${esc(a.label)}</span></button>`).join('')}</footer>` : ''}
  </div>`;
  let closed = false;
  const api = {
    el: wrap.querySelector('.sheet'),
    body: wrap.querySelector('.sheet-body'),
    close(result) {
      if (closed) return; closed = true;
      wrap.classList.add('out');
      const i = sheetStack.indexOf(api); if (i >= 0) sheetStack.splice(i, 1);
      setTimeout(() => wrap.remove(), 180);
      if (onClose) onClose(result);
    },
  };
  wrap.addEventListener('pointerdown', (e) => { if (e.target === wrap) wrap._down = true; });
  wrap.addEventListener('click', (e) => { if (e.target === wrap && wrap._down) api.close(); wrap._down = false; });
  wrap.querySelector('.sheet-x').onclick = () => api.close();
  wrap.querySelectorAll('.sheet-foot button').forEach((b) => {
    b.onclick = async () => {
      const a = actions[+b.dataset.i];
      if (a.fn) { const r = await a.fn(api); if (r === false) return; }
      if (!a.keepOpen) api.close(a.value);
    };
  });
  root.appendChild(wrap);
  sheetStack.push(api);
  requestAnimationFrame(() => {
    wrap.classList.add('in');
    const f = wrap.querySelector('[autofocus]') || wrap.querySelector('.sheet-body input, .sheet-body textarea, .sheet-body select');
    if (f && !matchMedia('(pointer: coarse)').matches) f.focus();
  });
  return api;
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sheetStack.length) { e.preventDefault(); sheetStack[sheetStack.length - 1].close(); }
});

function confirmBox(message, { title = 'Are you sure?', ok = 'OK', danger = false, cancel = 'Cancel' } = {}) {
  return new Promise((resolve) => {
    openSheet({

}
function promptBox(title, value = '', { placeholder = '', ok = 'Save', type = 'text', label = '', multiline = false, extra = '' } = {}) {
  return new Promise((resolve) => {
    const id = 'pr-' + uid();
    const field = multiline

    let result = null;

function chooseBox(title, options, { note = '' } = {}) {

async function copyText(text) {

  catch (e) {

// ---------------------------------------------------------------------------
// Local storage: IndexedDB with an in-memory fallback (some embedded browsers
// block IndexedDB). Holds documents, image blobs and small key/values.
// ---------------------------------------------------------------------------
const Store = {
  db: null,
  mem: null, // {docs: Map, blobs: Map, kv: Map} when IndexedDB is unavailable
  persistent: false,

  async init() {
    try {
      if (!('indexedDB' in window)) throw new Error('no idb');
      this.db = await withTimeout(new Promise((res, rej) => {
        const r = indexedDB.open('flatbed-scanner', 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          if (!db.objectStoreNames.contains('docs')) db.createObjectStore('docs', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs');
          if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));

      await this._tx('kv', 'readwrite', (s) => s.put(Date.now(), '_probe'));
      this.persistent = true;
    } catch (e) {
      console.warn('IndexedDB unavailable, using memory store', e);
      this.db = null;
      this.mem = { docs: new Map(), blobs: new Map(), kv: new Map() };
    }
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode);
      const s = tx.objectStore(store);
      let out;
      const r = fn(s);
      if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('Transaction aborted'));
    });
  },
  async allDocs() {
    if (this.mem) return Array.from(this.mem.docs.values()).map((d) => structuredClone(d));
    return (await this._tx('docs', 'readonly', (s) => s.getAll())) || [];
  },
  async putDoc(doc) {
    if (this.mem) { this.mem.docs.set(doc.id, structuredClone(doc)); return; }
    await this._tx('docs', 'readwrite', (s) => s.put(doc));
  },
  async delDoc(id) {
    if (this.mem) { this.mem.docs.delete(id); return; }
    await this._tx('docs', 'readwrite', (s) => s.delete(id));
  },
  async putBlob(blob, key) {
    key = key || 'b' + uid();
    if (this.mem) { this.mem.blobs.set(key, blob); return key; }
    await this._tx('blobs', 'readwrite', (s) => s.put(blob, key));
    return key;
  },
  async getBlob(key) {
    if (!key) return null;
    if (this.mem) return this.mem.blobs.get(key) || null;
    return (await this._tx('blobs', 'readonly', (s) => s.get(key))) || null;
  },
  async delBlob(key) {
    if (!key) return;
    blobUrlRevoke(key);
    if (this.mem) { this.mem.blobs.delete(key); return; }
    await this._tx('blobs', 'readwrite', (s) => s.delete(key));
  },
  async getKV(key, def) {
    try {
      if (this.mem) return this.mem.kv.has(key) ? structuredClone(this.mem.kv.get(key)) : def;
      const v = await this._tx('kv', 'readonly', (s) => s.get(key));
      return v === undefined ? def : v;
    } catch (e) { return def; }
  },
  async setKV(key, val) {
    if (this.mem) { this.mem.kv.set(key, structuredClone(val)); return; }
    await this._tx('kv', 'readwrite', (s) => s.put(val, key));
  },
  async usage() {
    try { if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate(); } catch (e) { /* ignore */ }
    return null;
  },

// Object URLs for stored blobs, cached by key.
const blobUrls = new Map();
async function blobUrl(key) {

// ---------------------------------------------------------------------------
// Image processing. Every ip* function is pure and self-contained so the same

    for (y = 0; y < h; y++) {

// Standard security handler, revision 6 (AES-256), ISO 32000-2 algorithm 2.B.
async function pdfMakeCrypt(userPassword, ownerPassword) {
  const S = crypto.subtle;
  const prep = (pw) => TE.encode(String(pw || '').normalize('NFKC')).slice(0, 127);
  const upw = prep(userPassword);
  const opw = ownerPassword ? prep(ownerPassword) : rnd(24);
  const fileKey = rnd(32);
  const sha = async (alg, data) => new Uint8Array(await S.digest(alg, data));
  const aesCbc = async (keyBytes, iv, data) => {
    const k = await S.importKey('raw', keyBytes, { name: 'AES-CBC' }, false, ['encrypt']);
    return new Uint8Array(await S.encrypt({ name: 'AES-CBC', iv }, k, data));
  };
  const hash2B = async (pw, salt, udata) => {
    let k = await sha('SHA-256', u8concat(pw, salt, udata));
    let i = 0, e = null;
    while (i < 64 || e[e.length - 1] > i - 32) {
      const comb = u8concat(pw, k, udata);
      const k1 = new Uint8Array(comb.length * 64);
      for (let j = 0; j < 64; j++) k1.set(comb, j * comb.length);
      e = (await aesCbc(k.slice(0, 16), k.slice(16, 32), k1)).slice(0, k1.length);
      let s = 0; for (let j = 0; j < 16; j++) s += e[j];
      const m = s % 3;
      k = await sha(m === 0 ? 'SHA-256' : m === 1 ? 'SHA-384' : 'SHA-512', e);
      i++;
    }
    return k.slice(0, 32);
  };
  const empty = new Uint8Array(0), zero = new Uint8Array(16);
  const uvs = rnd(8), uks = rnd(8), ovs = rnd(8), oks = rnd(8);
  const U = u8concat(await hash2B(upw, uvs, empty), uvs, uks);
  const UE = (await aesCbc(await hash2B(upw, uks, empty), zero, fileKey)).slice(0, 32);
  const O = u8concat(await hash2B(opw, ovs, U), ovs, oks);
  const OE = (await aesCbc(await hash2B(opw, oks, U), zero, fileKey)).slice(0, 32);
  const P = -4, pv = P >>> 0;
  const perms = new Uint8Array(16);
  perms[0] = pv & 255; perms[1] = (pv >>> 8) & 255; perms[2] = (pv >>> 16) & 255; perms[3] = (pv >>> 24) & 255;
  perms[4] = perms[5] = perms[6] = perms[7] = 0xff;
  perms[8] = 0x54; perms[9] = 0x61; perms[10] = 0x64; perms[11] = 0x62; perms.set(rnd(4), 12);
  const Perms = (await aesCbc(fileKey, zero, perms)).slice(0, 16);
  const fk = await S.importKey('raw', fileKey, { name: 'AES-CBC' }, false, ['encrypt']);
  return {
    dict: `<< /Filter /Standard /V 5 /R 6 /Length 256 /CF << /StdCF << /AuthEvent /DocOpen /CFM /AESV3 /Length 32 >> >> /StmF /StdCF /StrF /StdCF /O <${hex(O)}> /U <${hex(U)}> /OE <${hex(OE)}> /UE <${hex(UE)}> /P ${P} /Perms <${hex(Perms)}> /EncryptMetadata true >>`,
    async encrypt(data) {
      const iv = rnd(16);
      return u8concat(iv, new Uint8Array(await S.encrypt({ name: 'AES-CBC', iv }, fk, data)));
    },
  };
}

/**
 * pages: [{ w, h (points), image: {kind:'jpeg'|'bw1', data:Uint8Array, pxW, pxH},
 *           box: {x, y, w, h} (points, origin bottom-left), words: [{s, x, y, w, h}] (points) }]
 * opts: { title, password, ownerPassword }
 */
async function pdfBuild(pages, opts = {}) {
  const crypt = opts.password ? await pdfMakeCrypt(opts.password, opts.ownerPassword) : null;
  const chunks = []; let pos = 0; const offsets = [];
  const push = (u8) => { chunks.push(u8); pos += u8.length; };
  const str = (s) => push(TE.encode(s));
  const encS = async (u8) => (crypt ? crypt.encrypt(u8) : u8);
  const textStr = async (s) => '<' + hex(await encS(pdfTextBytes(s))) + '>';

  let next = 1; const alloc = () => next++;
  const catalogId = alloc(), pagesId = alloc(), infoId = alloc();
  const anyWords = pages.some((p) => p.words && p.words.length);
  const fontId = anyWords ? alloc() : 0;
  const encId = crypt ? alloc() : 0;
  const pageRefs = pages.map(() => ({ page: alloc(), content: alloc(), image: alloc() }));

  const obj = async (id, dict, stream) => {
    offsets[id] = pos;
    if (stream) {
      const data = await encS(stream);
      str(`${id} 0 obj\n${dict.replace('%LEN%', String(data.length))}\nstream\n`);
      push(data);
      str('\nendstream\nendobj\n');
    } else {
      str(`${id} 0 obj\n${dict}\nendobj\n`);
    }
  };

  push(new Uint8Array([0x25, 0x50, 0x44, 0x46, 0x2d, 0x31, 0x2e, 0x37, 0x0a, 0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));
  const ext = crypt ? ' /Extensions << /ADBE << /BaseVersion /1.7 /ExtensionLevel 8 >> >>' : '';
  await obj(catalogId, `<< /Type /Catalog /Pages ${pagesId} 0 R${ext} >>`);
  await obj(pagesId, `<< /Type /Pages /Count ${pages.length} /Kids [${pageRefs.map((r) => r.page + ' 0 R').join(' ')}] >>`);
  const d = new Date(), p2 = (n) => String(n).padStart(2, '0');
  const date = `D:${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
  await obj(infoId, `<< /Title ${await textStr(opts.title || 'Scan')} /Producer ${await textStr('Flatbed Scanner')} /Creator ${await textStr('Flatbed Scanner')} /CreationDate ${await textStr(date)} >>`);
  if (fontId) await obj(fontId, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');

  for (let i = 0; i < pages.length; i++) {
    const pg = pages[i], r = pageRefs[i], im = pg.image, b = pg.box;
    let cs = `q\n${pdfNum(b.w)} 0 0 ${pdfNum(b.h)} ${pdfNum(b.x)} ${pdfNum(b.y)} cm\n/Im0 Do\nQ\n`;
    if (pg.words && pg.words.length) {
      cs += 'BT\n3 Tr\n';
      for (const wd of pg.words) {
        const codes = winAnsi(wd.s);
        if (!codes || !codes.length || wd.w <= 0 || wd.h <= 0) continue;
        const fs = Math.max(1, wd.h * 0.9);
        const natural = helvWidth(codes) * fs / 1000;
        const tz = natural > 0 ? Math.max(1, Math.min(1000, 100 * wd.w / natural)) : 100;
        cs += `/F1 ${pdfNum(fs)} Tf ${pdfNum(tz)} Tz 1 0 0 1 ${pdfNum(wd.x)} ${pdfNum(wd.y + wd.h * 0.22)} Tm ${pdfLiteral(codes)} Tj\n`;
      }
      cs += 'ET\n';
    }
    const res = `/XObject << /Im0 ${r.image} 0 R >>` + (fontId ? ` /Font << /F1 ${fontId} 0 R >>` : '');
    await obj(r.page, `<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pdfNum(pg.w)} ${pdfNum(pg.h)}] /Resources << ${res} >> /Contents ${r.content} 0 R >>`);
    await obj(r.content, '<< /Length %LEN% >>', TE.encode(cs));
    if (im.kind === 'bw1') {
      await obj(r.image, `<< /Type /XObject /Subtype /Image /Width ${im.pxW} /Height ${im.pxH} /ColorSpace /DeviceGray /BitsPerComponent 1 /Filter /FlateDecode /Length %LEN% >>`, im.data);
    } else {
      await obj(r.image, `<< /Type /XObject /Subtype /Image /Width ${im.pxW} /Height ${im.pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length %LEN% >>`, im.data);
    }
  }
  if (crypt) { offsets[encId] = pos; str(`${encId} 0 obj\n${crypt.dict}\nendobj\n`); }

  const xref = pos, size = next;
  let x = `xref\n0 ${size}\n0000000000 65535 f \n`;
  for (let i = 1; i < size; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  const id = hex(rnd(16));
  x += `trailer\n<< /Size ${size} /Root ${catalogId} 0 R /Info ${infoId} 0 R /ID [<${id}> <${id}>]${crypt ? ` /Encrypt ${encId} 0 R` : ''} >>\nstartxref\n${xref}\n%%EOF\n`;
  str(x);
  return new Blob(chunks, { type: 'application/pdf' });
}

// zlib deflate via the platform (FlateDecode-compatible). Returns null if unsupported.
async function deflateBytes(u8) {
  if (typeof CompressionStream === 'undefined') return null;
  try {
    const cs = new CompressionStream('deflate');
    const out = new Blob([u8]).stream().pipeThrough(cs);
    return new Uint8Array(await new Response(out).arrayBuffer());
  } catch (e) { return null; }
}

const CRC_TABLE = (() => {

    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true);
    ch.setUint32(42, offset, true);

  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true);

const OCR_LANGS = [

function b64ToBytes(b64) {
  if (typeof Uint8Array.fromBase64 === 'function') return Uint8Array.fromBase64(b64);
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
const OCR = {
  worker: null, lang: null, loading: null, onLog: null,
  async ensure(lang, onProgress) {
    if (this.worker && this.lang === lang) return this.worker;
    if (this.loading) { try { await this.loading; } catch (e) { /* retry below */ } if (this.worker && this.lang === lang) return this.worker; }
    this.loading = (async () => {
      if (this.worker) { try { await this.worker.terminate(); } catch (e) { /* ignore */ } this.worker = null; this.lang = null; }
      await loadScript(absUrl('lib/tesseract/tesseract.min.js'));
      if (onProgress) onProgress(0.04, 'Loading text recognition…');
      const langs = [];
      for (const c of lang.split('+')) {
        const r = await fetch(absUrl(`lib/ocr/${c}.traineddata.b64.txt`));
        if (!r.ok) throw new Error('Could not load text recognition data');
        langs.push({ code: c, data: b64ToBytes((await r.text()).trim()) });
      }
      if (onProgress) onProgress(0.15, 'Starting text recognition…');
      this.worker = await withTimeout(window.Tesseract.createWorker(langs, 1, {
        workerPath: absUrl('lib/tesseract/worker.min.js'),
        corePath: absUrl('lib/tesseract/'),
        cacheMethod: 'none',
        workerBlobURL: true,
        logger: (m) => { if (this.onLog) this.onLog(m); },
        errorHandler: (e) => console.warn('OCR worker', e),
      }), 120000, 'OCR start timed out');
      this.lang = lang;
    })();
    try { await this.loading; }
    catch (e) {
      console.warn('OCR start failed', e);
      this.worker = null; this.lang = null;
      throw new Error(navigator.onLine === false
        ? 'Text recognition needs an internet connection the first time you use it. Connect once, then it works offline.'
        : 'Text recognition could not start. Check your connection and try again.');
    } finally { this.loading = null; }
    return this.worker;
  },
  async recognize(blob, lang, onProgress) {
    const w = await this.ensure(lang, onProgress);
    this.onLog = (m) => { if (m.status === 'recognizing text' && onProgress) onProgress(0.2 + 0.8 * (m.progress || 0), 'Reading text…'); };
    try {
      const { data } = await w.recognize(blob, {}, { text: true, blocks: true });
      return data;
    } finally { this.onLog = null; }
  },
};

    if (!wd.text || !wd.text.trim() || wd.confidence < 15) continue;
    const bb = wd.bbox;
    words.push({ s: wd.text, x: r4(bb.x0 / w), y: r4(bb.y0 / h), w: r4((bb.x1 - bb.x0) / w), h: r4((bb.y1 - bb.y0) / h) });
  }
  const text = String(data.text || '').replace(/\n{3,}/g, '\n\n').trim();
  return { text, words, lang, src: 'ocr', at: Date.now() };
}

// ------------------------------- PDF import --------------------------------
const PDFIn = {
  async lib() {
    await loadScript(absUrl('lib/pdfjs/pdf.min.js'));
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = absUrl('lib/pdfjs/pdf.worker.min.js');
    return window.pdfjsLib;
  },
  async open(file) {
    const lib = await this.lib();
    const data = new Uint8Array(await file.arrayBuffer());
    const task = lib.getDocument({ data, isEvalSupported: false });
    let asked = 0;
    task.onPassword = (update, reason) => {
      asked++;
      busy.hide();
      promptBox(reason === 2 ? 'Wrong password. Try again.' : `“${file.name}” is password protected`, '', { type: 'password', ok: 'Open', label: 'PDF password' })
        .then((pw) => { busy.show('Opening PDF…'); if (pw === null) task.destroy(); else update(pw); });
    };
    try { return await task.promise; }
    catch (e) {
      if (asked && /destroy|cancel/i.test(String(e && e.message))) throw new Error('Cancelled');
      throw new Error('This PDF could not be opened.');
    }
  },
  async renderPage(pdf, n, maxDim = 2000) {
    const page = await pdf.getPage(n);
    const base = page.getViewport({ scale: 1 });
    const scale = Math.min(4, maxDim / Math.max(base.width, base.height));
    const vp = page.getViewport({ scale });
    const c = makeCanvas(vp.width, vp.height), ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    let ocr = null;
    try {
      const tc = await page.getTextContent();
      const words = []; let text = '';
      for (const it of tc.items) {
        if (typeof it.str !== 'string') continue;
        text += it.str + (it.hasEOL ? '\n' : (it.str ? ' ' : ''));
        if (!it.str.trim()) continue;
        const tx = it.transform, x = tx[4], y = tx[5], hgt = Math.hypot(tx[2], tx[3]) || it.height || 10;
        const r = vp.convertToViewportRectangle([x, y - hgt * 0.2, x + it.width, y + hgt * 0.85]);
        const x0 = Math.min(r[0], r[2]), x1 = Math.max(r[0], r[2]), y0 = Math.min(r[1], r[3]), y1 = Math.max(r[1], r[3]);
        words.push({ s: it.str, x: r4(x0 / c.width), y: r4(y0 / c.height), w: r4((x1 - x0) / c.width), h: r4((y1 - y0) / c.height) });
      }
      text = text.replace(/[ \t]+\n/g, '\n').trim();
      if (text.length > 3) ocr = { text, words, lang: 'pdf', src: 'pdf', at: Date.now() };
    } catch (e) { /* scanned PDF without text */ }
    page.cleanup();
    return { canvas: c, ocr };
  },
};

// --------------------------------- QR --------------------------------------
async function decodeCodes(file) {
  const c = await blobToCanvas(file, 1600);
  if ('BarcodeDetector' in window) {
    try {
      const bd = new window.BarcodeDetector();
      const r = await bd.detect(c);
      if (r && r.length) return r.map((x) => ({ text: x.rawValue, format: x.format }));
    } catch (e) { /* fall back to jsQR */ }
  }
  await loadScript(absUrl('lib/jsQR.js'));
  for (const dim of [1600, 1000, 600]) {
    const cc = scaleCanvas(c, dim), id = getImageData(cc);
    const res = window.jsQR(id.data, id.width, id.height, { inversionAttempts: 'attemptBoth' });
    if (res && res.data) return [{ text: res.data, format: 'qr_code' }];
  }
  return [];
}

// ---------------------------------------------------------------------------
// Cloud backup & sync across devices, using the artifact's private per-user
// database (document metadata) and asset storage (page images).
// Local IndexedDB stays the working copy; the cloud is the durable copy.
// ---------------------------------------------------------------------------
const Cloud = {
  state: 'off', note: '', lastSync: 0,
  db: null, assets: null, uid: null, col: null, sigCol: null,
  map: {}, rev: {}, queue: Promise.resolve(), timers: {},

  setState(s, note = '') { this.state = s; this.note = note; renderCloudChip(); },
  get ready() { return !!this.col && S.settings.cloud !== false; },

  async init() {
    if (!IN_CLAUDE) { this.setState('unavailable', 'Your scans are saved in this browser on this device. Export important documents as PDFs to keep a copy somewhere else.'); return; }
    this.setState('connecting');
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) { this.setState('unavailable', 'Sign in to Claude to back up your scans.'); return; }
      const assets = await window.claude.use('assets');
      if (!assets) { this.setState('unavailable', 'Cloud backup is available to the app’s owner and editors. Your scans stay on this device.'); return; }
      const id = await user.id();
      if (!id) { this.setState('unavailable', 'Sign in to Claude to back up your scans.'); return; }
      this.db = db; this.assets = assets; this.uid = id;
      const lib = db.doc(`data/users/${id}/library`);
      this.col = lib.collection('docs');
      this.sigCol = lib.collection('sigs');
      this.map = await Store.getKV('assetMap', {});
      this.rev = {}; for (const k of Object.keys(this.map)) this.rev[this.map[k]] = k;
      this.setState('ready');
      if (S.settings.cloud !== false) this.syncAll().catch(() => {});
    } catch (e) {
      console.warn('Cloud init', e);
      this.setState('error', 'Cloud backup could not start.');
    }
  },

  enqueue(fn) {
    const run = this.queue.then(() => fn());
    this.queue = run.catch((e) => {
      console.warn('Cloud', e);
      const code = e && e.code;
      const msg = code === 'quota_or_state' || code === 'quota_exceeded' ? 'Cloud storage is full. Delete some documents to keep backing up.'
        : code === 'rate_limited' || code === 'resource_exhausted' ? 'Backing up too fast; will retry on the next change.'
        : 'Backup paused: ' + ((e && (e.message || e.code)) || 'unknown error');
      this.setState('error', msg);
    });
    return run;
  },
  async saveMap() { await Store.setKV('assetMap', this.map); },
  forgetAsset(id) { const k = this.rev[id]; if (k) { delete this.map[k]; delete this.rev[id]; } },

  async upKey(key, type) {
    if (!key) return null;
    if (this.map[key]) return this.map[key];
    const blob = await Store.getBlob(key);
    if (!blob) return null;
    const r = await this.assets.upload(blob, { type });
    this.map[key] = r.id; this.rev[r.id] = key;
    await this.saveMap();
    return r.id;
  },
  async downAsset(assetId) {
    if (!assetId) return null;
    const k = this.rev[assetId];
    if (k && await Store.getBlob(k)) return k;
    const r = await fetch('/_blob/' + assetId);
    if (!r.ok) throw new Error('A file is missing from cloud storage');
    const key = await Store.putBlob(await r.blob());
    this.map[key] = assetId; this.rev[assetId] = key;
    await this.saveMap();
    return key;
  },

  touch(doc) {
    if (!this.ready || doc.sample) return;
    clearTimeout(this.timers[doc.id]);
    this.timers[doc.id] = setTimeout(() => {
      delete this.timers[doc.id];
      this.enqueue(async () => {
        const live = S.docs.find((d) => d.id === doc.id);
        if (!live) return;
        this.setState('syncing');
        await this.pushDoc(live);
        this.lastSync = Date.now();
        this.setState('ready');
      });
    }, 1500);
  },

  async pushDoc(doc) {
    const ids = [], pages = [];
    for (const p of doc.pages) {
      const a = {
        orig: await this.upKey(p.orig, 'image/jpeg'),
        proc: await this.upKey(p.proc, 'image/jpeg'),
        thumb: await this.upKey(p.thumb, 'image/jpeg'),
      };
      const marks = [];
      for (const m of p.marks || []) {
        const mm = Object.assign({}, m);
        if (m.blob) { mm.asset = await this.upKey(m.blob, 'image/png'); delete mm.blob; }
        marks.push(mm);
      }
      if (marks.length || p.ocr) {
        const json = JSON.stringify({ marks, ocr: p.ocr || null });
        const h = await sha1hex(json);
        if (p.cloudExtra && p.cloudExtra.h === h) a.extra = p.cloudExtra.id;
        else {
          const r = await this.assets.upload(new Blob([json], { type: 'application/json' }), { type: 'application/json' });
          a.extra = r.id; p.cloudExtra = { h, id: r.id };
        }
      } else { delete p.cloudExtra; }
      for (const v of Object.values(a)) if (v) ids.push(v);
      for (const m of marks) if (m.asset) ids.push(m.asset);
      pages.push({ id: p.id, ow: p.ow, oh: p.oh, pw: p.pw, ph: p.ph, quad: p.quad, filter: p.filter, adj: p.adj || null, rot: p.rot || 0, kind: p.kind || null, a });
    }
    const body = { v: 1, title: doc.title, folder: doc.folder || '', starred: !!doc.starred, createdAt: doc.createdAt, updatedAt: doc.updatedAt, pages };
    await this.col.doc(doc.id).set(body);
    const keep = new Set(ids);
    for (const id of doc.cloudAssets || []) {
      if (keep.has(id)) continue;
      try { await this.assets.delete(id); } catch (e) { /* already gone */ }
      this.forgetAsset(id);
    }
    await this.saveMap();
    doc.cloudAssets = ids; doc.cloudAt = doc.updatedAt;
    await Store.putDoc(doc);
  },

  async pullDoc(id, body, local) {
    const pages = [], ids = [];
    for (const cp of body.pages || []) {
      const a = cp.a || {};
      const lp = local && local.pages.find((x) => x.id === cp.id);
      const p = { id: cp.id, ow: cp.ow, oh: cp.oh, pw: cp.pw, ph: cp.ph, quad: cp.quad, filter: cp.filter, adj: cp.adj || { b: 0, c: 0, s: 0 }, rot: cp.rot || 0, marks: [], ocr: null };
      if (cp.kind) p.kind = cp.kind;
      p.orig = await this.downAsset(a.orig);
      p.proc = await this.downAsset(a.proc);
      p.thumb = await this.downAsset(a.thumb);
      if (a.extra) {
        if (lp && lp.cloudExtra && lp.cloudExtra.id === a.extra) { p.marks = lp.marks; p.ocr = lp.ocr; p.cloudExtra = lp.cloudExtra; }
        else {
          const r = await fetch('/_blob/' + a.extra);
          if (r.ok) {
            const text = await r.text(), j = JSON.parse(text);
            for (const m of j.marks || []) { if (m.asset) { ids.push(m.asset); m.blob = await this.downAsset(m.asset); delete m.asset; } }
            p.marks = j.marks || []; p.ocr = j.ocr || null; p.cloudExtra = { id: a.extra, h: await sha1hex(text) };
          }
        }
      }
      for (const v of Object.values(a)) if (v) ids.push(v);
      if (p.proc) pages.push(p);
    }
    const doc = { id, title: body.title || 'Untitled', folder: body.folder || '', starred: !!body.starred, createdAt: body.createdAt || Date.now(), updatedAt: body.updatedAt || Date.now(), pages, cloudAssets: ids, cloudAt: body.updatedAt };
    if (local) {
      const used = new Set(docBlobKeys(doc));
      for (const k of docBlobKeys(local)) if (!used.has(k)) await Store.delBlob(k);
    }
    await Store.putDoc(doc);
    const i = S.docs.findIndex((d) => d.id === id);
    if (i >= 0) S.docs[i] = doc; else S.docs.push(doc);
  },

  async deleteRemote(id, assetIds) {
    await this.col.doc(id).set({ deleted: true, updatedAt: Date.now() });
    for (const a of assetIds || []) { try { await this.assets.delete(a); } catch (e) { /* ignore */ } this.forgetAsset(a); }
    await this.saveMap();
  },
  async docDeleted(doc) {
    if (doc.sample) return;
    if (this.ready) { this.enqueue(() => this.deleteRemote(doc.id, doc.cloudAssets)); return; }
    if (doc.cloudAt) { const t = await Store.getKV('tombstones', {}); t[doc.id] = { at: Date.now(), assets: doc.cloudAssets || [] }; await Store.setKV('tombstones', t); }
  },

  syncAll() {
    if (!this.ready) return Promise.resolve();
    return this.enqueue(async () => {
      this.setState('syncing');
      const snap = await withTimeout(this.col.get(), 20000, 'The cloud did not answer');
      const cloud = new Map();
      for (const d of snap.docs) if (d.exists) cloud.set(d.id, d.data());
      const tomb = await Store.getKV('tombstones', {});
      for (const id of Object.keys(tomb)) {
        const c = cloud.get(id);
        if (!c || !c.deleted) {
          const all = new Set([...(c && c.pages ? collectBodyAssets(c) : []), ...((tomb[id] && tomb[id].assets) || [])]);
          await this.deleteRemote(id, Array.from(all));
        }
        delete tomb[id];
        await Store.setKV('tombstones', tomb);
        cloud.set(id, { deleted: true });
      }
      for (const local of S.docs.slice()) {
        if (local.sample) continue;
        const c = cloud.get(local.id);
        if (!c) { await this.pushDoc(local); continue; }
        if (c.deleted) {
          if ((c.updatedAt || 0) >= local.updatedAt) await removeDocLocal(local.id, true);
          else await this.pushDoc(local);
          continue;
        }
        if (local.updatedAt > (c.updatedAt || 0)) await this.pushDoc(local);
        else if ((c.updatedAt || 0) > local.updatedAt) await this.pullDoc(local.id, c, local);
      }
      for (const [id, c] of cloud) {
        if (c.deleted || S.docs.find((d) => d.id === id)) continue;
        await this.pullDoc(id, c, null);
      }
      await this.syncSigs();
      this.lastSync = Date.now();
      this.setState('ready');
      refreshView();
    });
  },

  async syncSigs() {
    const snap = await withTimeout(this.sigCol.get(), 20000, 'The cloud did not answer');
    const cloud = new Map();
    for (const d of snap.docs) if (d.exists) cloud.set(d.id, d.data());
    let sigs = await Store.getKV('sigs', []);
    const tomb = await Store.getKV('sigTombstones', {});
    for (const id of Object.keys(tomb)) {
      const c = cloud.get(id);
      if (c && !c.deleted) { await this.sigCol.doc(id).set({ deleted: true, at: Date.now() }); if (c.asset) { try { await this.assets.delete(c.asset); } catch (e) { /* ignore */ } this.forgetAsset(c.asset); } }
      delete tomb[id]; cloud.set(id, { deleted: true });
    }
    await Store.setKV('sigTombstones', tomb);
    let changed = false;
    for (const s of sigs.slice()) {
      const c = cloud.get(s.id);
      if (!c) { const asset = await this.upKey(s.key, 'image/png'); await this.sigCol.doc(s.id).set({ asset, w: s.w, h: s.h, createdAt: s.createdAt }); }
      else if (c.deleted) { sigs = sigs.filter((x) => x.id !== s.id); await Store.delBlob(s.key); changed = true; }
    }
    for (const [id, c] of cloud) {
      if (c.deleted || sigs.find((x) => x.id === id) || !c.asset) continue;
      const key = await this.downAsset(c.asset);
      sigs.push({ id, key, w: c.w, h: c.h, createdAt: c.createdAt || Date.now() }); changed = true;
    }
    if (changed) await Store.setKV('sigs', sigs);
  },
  sigAdded(sig) {
    if (!this.ready) return;
    this.enqueue(async () => { const asset = await this.upKey(sig.key, 'image/png'); await this.sigCol.doc(sig.id).set({ asset, w: sig.w, h: sig.h, createdAt: sig.createdAt }); });
  },
  async sigDeleted(sig) {
    if (this.ready) {
      const asset = this.map[sig.key];
      this.enqueue(async () => { await this.sigCol.doc(sig.id).set({ deleted: true, at: Date.now() }); if (asset) { try { await this.assets.delete(asset); } catch (e) { /* ignore */ } this.forgetAsset(asset); await this.saveMap(); } });
    } else { const t = await Store.getKV('sigTombstones', {}); t[sig.id] = Date.now(); await Store.setKV('sigTombstones', t); }
  },
  async usage() {
    if (!this.assets) return null;
    try { const r = await this.assets.list(); return r.usage; } catch (e) { return null; }
  },
};

function collectBodyAssets(body) {
  const ids = [];
  for (const p of body.pages || []) for (const v of Object.values(p.a || {})) if (v) ids.push(v);
  return ids;
}
async function sha1hex(s) {
  const d = await crypto.subtle.digest('SHA-1', TE.encode(s));
  return hex(new Uint8Array(d));
}

  theme: 'system', filter: 'magic', autoCrop: true, quality: 'standard', pageSize: 'auto', margin: 'none',
  ocrLang: 'eng', cloud: true, layout: 'list', sort: 'updated', folders: [],
};

  { id: 'lighten', label: 'Lighten' }, { id: 'gray', label: 'Grayscale' }, { id: 'bw', label: 'B&W' },
];
const FULL_QUAD = [0, 0, 1, 0, 1, 1, 0, 1];
const isFullQuad = (q) => !q || q.every((v, i) => Math.abs(v - FULL_QUAD[i]) < 1e-4);
const STORE_MAX = 2400, STORE_JPEG = 0.9;
const LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M3.5 12.5h17" style="stroke:var(--accent)"/></svg>';

function newDoc(title, pages, extra = {}) {

async function saveDoc(doc, touch = true) {

  await Store.putDoc(doc);
  Cloud.touch(doc);
}
function docBlobKeys(doc) {
  const k = [];
  for (const p of doc.pages) { k.push(p.orig, p.proc, p.thumb); for (const m of p.marks || []) if (m.blob) k.push(m.blob); }
  return k.filter(Boolean);
}
async function removeDocLocal(id, fromCloud = false) {

async function deletePageBlobs(p) {

}
async function copyPage(p) {

  for (const k of ['orig', 'proc', 'thumb']) { const b = await Store.getBlob(p[k]); np[k] = b ? await Store.putBlob(b) : null; }
  for (const m of np.marks || []) if (m.blob) { const b = await Store.getBlob(m.blob); m.blob = b ? await Store.putBlob(b) : null; }

}
function docText(doc) { return doc.pages.map((p) => (p.ocr && p.ocr.text) || '').join('\n'); }
function allFolders() {

// Process a source image into a stored page (new or replacing `existing`).
async function buildPage(src, existing) {
  const origBlob = src.origBlob || await Store.getBlob(src.origKey);
  if (!origBlob) throw new Error('The original photo for this page is missing.');
  const oc = await blobToCanvas(origBlob, STORE_MAX);
  const res = await IP.run('process', { img: getImageData(oc), quad: isFullQuad(src.quad) ? null : src.quad, filter: src.filter, adj: src.adj, rot: src.rot || 0, maxDim: STORE_MAX });
  const pc = imgDataToCanvas(res);
  const procBlob = await canvasToBlob(pc, 'image/jpeg', STORE_JPEG);
  const page = existing || { id: uid(), marks: [], ocr: null };
  const old = existing ? { orig: existing.orig, proc: existing.proc, thumb: existing.thumb } : null;
  page.orig = src.origKey || await Store.putBlob(origBlob);
  page.ow = oc.width; page.oh = oc.height;
  page.quad = (src.quad || FULL_QUAD).slice(); page.filter = src.filter || 'original';
  page.adj = { b: 0, c: 0, s: 0, ...(src.adj || {}) }; page.rot = src.rot || 0;
  if (src.kind) page.kind = src.kind;
  page.proc = await Store.putBlob(procBlob); page.pw = pc.width; page.ph = pc.height;
  page.thumb = await makeThumb(page, pc);
  if (old) {
    if (old.proc && old.proc !== page.proc) await Store.delBlob(old.proc);
    if (old.thumb && old.thumb !== page.thumb) await Store.delBlob(old.thumb);
    if (old.orig && old.orig !== page.orig) await Store.delBlob(old.orig);
  }
  return page;
}
async function makeThumb(page, procCanvas) {
  const c = await renderPage(page, { maxDim: 480, procCanvas });
  return Store.putBlob(await canvasToBlob(c, 'image/jpeg', 0.75));
}
async function refreshThumb(page) {
  const old = page.thumb;
  page.thumb = await makeThumb(page);
  if (old) await Store.delBlob(old);
}

// ------------------------------ File picking -------------------------------
// Must be called synchronously inside a click handler.
function pickFiles(kind, multiple = true) {
  return new Promise((resolve) => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = kind === 'pdf' ? 'application/pdf,.pdf' : 'image/*';
    if (kind === 'camera') inp.setAttribute('capture', 'environment');
    inp.multiple = !!multiple;
    inp.style.cssText = 'position:fixed;left:-9999px;opacity:0';
    document.body.appendChild(inp);
    let done = false;
    const finish = (list) => { if (done) return; done = true; resolve(list); setTimeout(() => inp.remove(), 0); };
    inp.addEventListener('change', () => finish(Array.from(inp.files || [])));
    inp.addEventListener('cancel', () => finish([]));
    inp.click();
  });
}
function menuSheet(title, items, note = '') {

  const s = openSheet({
    title,

function sortedDocs(list) {
  const s = S.settings.sort;
  return list.slice().sort((a, b) => s === 'name' ? a.title.localeCompare(b.title) : s === 'created' ? b.createdAt - a.createdAt : b.updatedAt - a.updatedAt);
}
const norm = (s) => String(s || '').normalize('NFKC').toLowerCase();
function filteredDocs() {
  let list = S.docs;
  if (S.folder === 'starred') list = list.filter((d) => d.starred);
  else if (S.folder !== 'all') list = list.filter((d) => d.folder === S.folder);
  const q = norm(S.query).trim();
  if (q) list = list.filter((d) => norm(d.title).includes(q) || norm(docText(d)).includes(q));
  return sortedDocs(list);
}
function snippetFor(doc) {
  const q = norm(S.query).trim();
  if (!q || norm(doc.title).includes(q)) return '';
  const text = docText(doc).replace(/\s+/g, ' ');
  const i = norm(text).indexOf(q);
  if (i < 0) return '';
  const a = Math.max(0, i - 40), b = Math.min(text.length, i + q.length + 60);
  return (a > 0 ? '…' : '') + esc(text.slice(a, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length, b)) + (b < text.length ? '…' : '');
}
function docCard(d) {
  const snip = snippetFor(d);
  return `<article class="doc-card" data-act="open-doc" data-id="${d.id}" tabindex="0" role="button" aria-label="Open ${esc(d.title)}">

function renderCloudChip() {

  };

async function cloudInfo() {
  const usage = await Cloud.usage();
  const st = Cloud.state;
  const on = S.settings.cloud !== false;
  let msg;
  if (st === 'unavailable') msg = Cloud.note || 'Cloud backup is not available here. Your scans are saved in this browser.';
  else if (!on) msg = 'Backup is turned off. Scans are kept only in this browser.';
  else if (st === 'error') msg = Cloud.note;
  else msg = 'Your scans are backed up privately to your Claude account and sync to this app on your other devices.' + (Cloud.lastSync ? ` Last sync ${new Date(Cloud.lastSync).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.` : '');
  const local = Store.persistent ? '' : '<p class="note warn">This browser blocks local storage, so scans live only in this tab until they are backed up.</p>';
  const meter = usage ? `<div><div class="row"><span class="grow note">Cloud storage</span><span class="mono note">${fmtBytes(usage.bytes)} of ${fmtBytes(usage.maxBytes)}</span></div><div class="meter"><i style="width:${Math.min(100, (usage.bytes / Math.max(1, usage.maxBytes)) * 100).toFixed(1)}%"></i></div></div>` : '';

    title: 'Backup & sync',
    body: `<p class="sheet-msg">${esc(msg)}</p>${local}${meter}
      ${Cloud.col ? `<div class="toggle-row"><div class="grow"><b>Back up to the cloud</b><small>Keeps a private copy of every scan</small></div><label class="switch"><input type="checkbox" id="cloud-on" ${on ? 'checked' : ''}><span></span></label></div>` : ''}`,
    actions: Cloud.col && on ? [{ label: 'Close' }, { label: 'Sync now', primary: true, icon: 'refresh', fn: () => { Cloud.syncAll().then(() => toast('Everything is backed up', { type: 'ok' })).catch(handleErr); } }] : [{ label: 'Close' }],
  });

}

async function sessSave() {
  const s = Sess.s; if (!s) return;
  const n = s.items.length;
  busy.show('Saving…');
  try {
    if (s.mode === 'edit') {
      const doc = getDoc(s.docId), page = doc && doc.pages.find((p) => p.id === s.pageId);
      if (!page) throw new Error('This page no longer exists.');
      const it = s.items[0];
      const geomChanged = it.quad.join() !== page.quad.join() || (it.rot || 0) !== (page.rot || 0);
      await buildPage({ origKey: it.origKey || null, origBlob: it.origBlob, quad: it.quad, filter: it.filter, adj: it.adj, rot: it.rot, kind: page.kind }, page);
      if (!it.origKey) page.ocr = null;
      else if (geomChanged && page.ocr) page.ocr.words = [];
      await saveDoc(doc);
      Sess.close(); busy.hide();
      refreshView(); refreshViewer();
      toast('Page updated', { type: 'ok' });
      return;
    }
    let pages = [];
    if (s.mode === 'id') {
      busy.progress(0.3, 'Placing both sides on one page…');
      pages = [await idCardPage(s.items)];
    } else {
      for (let i = 0; i < n; i++) {
        busy.progress(i / n, `Processing page ${i + 1} of ${n}…`);
        const it = s.items[i];
        if (s.mode === 'book') pages.push(...await bookPages(it));
        else pages.push(await buildPage({ origBlob: it.origBlob, quad: it.quad, filter: it.filter, adj: it.adj, rot: it.rot }));
      }
    }
    let doc;
    if (s.mode === 'add' && getDoc(s.docId)) {
      doc = getDoc(s.docId);
      doc.pages.push(...pages);
    } else {
      doc = newDoc(defaultTitle(s.mode === 'id' ? 'ID card' : s.mode === 'book' ? 'Book' : 'Scan'), pages);
    }
    await saveDoc(doc);
    const mode = s.mode, after = s.after;
    Sess.close();
    busy.hide();
    openDoc(doc.id);
    toast(mode === 'add' ? `Added ${pages.length} ${pages.length === 1 ? 'page' : 'pages'}` : 'Saved', { type: 'ok' });
    if (mode === 'ocr') await docTextSheet(doc, null, true);
    else if (after === 'export') openExport(doc, { fmt: 'pdf' });
  } catch (e) { busy.hide(); throw e; }
}

// ------------------------------- PDF import --------------------------------
function importPdf(opts = {}) {
  pickFiles('pdf', true).then((files) => { if (files.length) importPdfFiles(files, opts); });
}
async function importPdfFiles(files, opts = {}) {
    busy.show('Opening PDF…');
    try {
      const pages = [];
      let title = files[0].name.replace(/\.pdf$/i, '');
      for (const [fi, f] of files.entries()) {
        const pdf = await PDFIn.open(f);
        const n = pdf.numPages;
        if (n > 200) throw new Error('This PDF has more than 200 pages. Split it first.');
        for (let i = 1; i <= n; i++) {
          busy.progress(i / (n + 1), `Importing ${files.length > 1 ? `file ${fi + 1} of ${files.length}, ` : ''}page ${i} of ${n}…`);
          const { canvas, ocr } = await PDFIn.renderPage(pdf, i, 2000);
          const page = await buildPage({ origBlob: await canvasToBlob(canvas, 'image/jpeg', 0.92), quad: FULL_QUAD, filter: 'original', adj: null, rot: 0 });
          if (ocr) page.ocr = ocr;
          pages.push(page);
        }
        pdf.destroy();
      }
      if (files.length > 1) title = `Merged PDF (${files.length} files)`;
      let doc;
      if (opts.docId && getDoc(opts.docId)) { doc = getDoc(opts.docId); doc.pages.push(...pages); }
      else doc = newDoc(title, pages);
      await saveDoc(doc);
      busy.hide();
      openDoc(doc.id);
      toast(`Imported ${pages.length} ${pages.length === 1 ? 'page' : 'pages'}`, { type: 'ok' });
      if (opts.then) opts.then(doc);
    } catch (e) { busy.hide(); handleErr(e); }
}

async function rotatePage(doc, page, dir = 1) {
  const W = page.pw, H = page.ph;
  await busy.run('Rotating…', async () => {
    await buildPage({ origKey: page.orig, quad: page.quad, filter: page.filter, adj: page.adj, rot: ((page.rot || 0) + dir + 4) % 4, kind: page.kind }, page);
    page.marks = rotateMarks(page.marks || [], W, H, dir);

async function deletePages(doc, ids) {
  const keep = [], gone = [];
  for (const p of doc.pages) (ids.has(p.id) ? gone : keep).push(p);
  if (!keep.length) {
    if (!(await confirmBox('Every page would be removed, so the whole document will be deleted.', { title: 'Delete document?', ok: 'Delete', danger: true }))) return false;
    await deleteDoc(doc.id); closeAllOverlays(); go('home'); toast('Document deleted');
    return true;
  }
  doc.pages = keep;
  for (const p of gone) await deletePageBlobs(p);
  await saveDoc(doc);
  return true;
}

// ------------------------------ Text (OCR) ---------------------------------
async function runOcr(doc, pages, lang) {
  lang = lang || S.settings.ocrLang;
  const total = pages.length;
  for (let i = 0; i < total; i++) {
    const p = pages[i];
    const blob = await Store.getBlob(p.proc);
    const data = await OCR.recognize(blob, lang, (f, m) => busy.progress((i + f) / total, total > 1 ? `${m} · page ${i + 1} of ${total}` : m));
    p.ocr = ocrResultToPage(data, p.pw, p.ph, lang);
  }
  await saveDoc(doc);
}
async function ensureOcr(doc, pages, why) {
  const missing = pages.filter((p) => !p.ocr || !p.ocr.text);
  if (!missing.length) return true;
  busy.show(why || 'Reading text…');
  try { await runOcr(doc, missing); } finally { busy.hide(); }
  return true;
}
async function docTextSheet(doc, pageIdx, auto = false) {
  const pages = pageIdx == null ? doc.pages : [doc.pages[pageIdx]];
  const single = pages.length === 1;
  const missing = pages.filter((p) => !p.ocr || !p.ocr.text);
  if (missing.length) {
    busy.show('Reading text…');
    try { await runOcr(doc, missing); } catch (e) { busy.hide(); throw e; }
    busy.hide();

  const seg = (k, opts2) => `<div class="seg" data-k="${k}">${opts2.map(([v, l]) => `<button type="button" class="${String(st[k]) === String(v) ? 'on' : ''}" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>`;

  }

          <label class="field"><span class="field-label">Opacity · <span id="ex-op">${Math.round(st.wmOpacity * 100)}%</span></span><input type="range" min="5" max="60" value="${Math.round(st.wmOpacity * 100)}" id="ex-wmo"></label>

async function runExport(doc, pages, st) {
  const name = safeName(st.name || doc.title);
  const wm = st.wm ? { text: st.wmText.trim(), mode: st.wmMode, opacity: st.wmOpacity, color: st.wmColor } : null;
  const Q = QUAL[st.quality] || QUAL.standard;
  const needsText = st.fmt === 'docx' || st.fmt === 'txt' || (st.fmt === 'pdf' && st.searchable);
  busy.show('Preparing…');
  let blob, file;
  try {
    if (needsText) {
      const miss = pages.filter((p) => !p.ocr || !p.ocr.text || (st.fmt === 'pdf' && (!p.ocr.words || !p.ocr.words.length) && p.ocr.src === 'ocr' && !p.ocr.edited));
      if (miss.length) { busy.progress(0, 'Reading text…'); await runOcr(doc, miss); }
    }
    const prog = (f, m) => busy.progress(f, m);
    if (st.fmt === 'pdf') { blob = await buildPdfExport(doc, pages, st, Q, wm, prog); file = name + '.pdf'; }
    else if (st.fmt === 'jpg' || st.fmt === 'png') {
      const type = st.fmt === 'png' ? 'image/png' : 'image/jpeg', files = [];
      for (let i = 0; i < pages.length; i++) {
        prog(i / pages.length, `Rendering page ${i + 1} of ${pages.length}…`);
        const c = await renderPage(pages[i], { maxDim: Q.maxDim, watermark: wm });
        files.push({ name: `${name}-${String(i + 1).padStart(2, '0')}.${st.fmt}`, data: await blobBytes(await canvasToBlob(c, type, Q.jpeg)) });
      }
      if (files.length === 1) { blob = new Blob([files[0].data], { type }); file = `${name}.${st.fmt}`; }
      else { blob = zipBuild(files); file = `${name}.zip`; }
    } else if (st.fmt === 'long') {
      const canv = [];
      for (let i = 0; i < pages.length; i++) { prog(i / pages.length, `Rendering page ${i + 1} of ${pages.length}…`); canv.push(await renderPage(pages[i], { maxDim: Q.maxDim, watermark: wm })); }
      let W = Math.min(1400, Math.max(...canv.map((c) => c.width)));
      const gap = 16;
      let H = canv.reduce((h, c) => h + Math.round(c.height * W / c.width), 0) + gap * (canv.length - 1);
      const lim = Math.min(1, 30000 / H, Math.sqrt(16e6 / (W * H)));
      if (lim < 1) { W = Math.floor(W * lim); H = canv.reduce((h, c) => h + Math.round(c.height * W / c.width), 0) + gap * (canv.length - 1); }
      const out = makeCanvas(W, H), x = out.getContext('2d');
      x.fillStyle = '#e6e8e4'; x.fillRect(0, 0, W, H);
      let y = 0;
      for (const c of canv) { const h = Math.round(c.height * W / c.width); x.drawImage(c, 0, y, W, h); y += h + gap; }
      blob = await canvasToBlob(out, 'image/jpeg', Q.jpeg); file = `${name}-long.jpg`;
    } else if (st.fmt === 'txt') {
      const text = pages.map((p) => `--- Page ${doc.pages.indexOf(p) + 1} ---\n${(p.ocr && p.ocr.text) || ''}`).join('\n\n');
      blob = new Blob([pages.length === 1 ? pages[0].ocr.text : text], { type: 'text/plain;charset=utf-8' }); file = name + '.txt';
    } else if (st.fmt === 'docx') {
      const sections = [];
      for (let i = 0; i < pages.length; i++) {
        prog(i / pages.length, `Adding page ${i + 1} of ${pages.length}…`);
        const p = pages[i], sec = { heading: pages.length > 1 ? `Page ${doc.pages.indexOf(p) + 1}` : '', text: (p.ocr && p.ocr.text) || '' };
        if (st.docxImages) { const c = await renderPage(p, { maxDim: 1600 }); sec.image = { data: await blobBytes(await canvasToBlob(c, 'image/jpeg', 0.82)), pxW: c.width, pxH: c.height }; }
        sections.push(sec);
      }
      blob = docxBuild(sections, doc.title); file = name + '.docx';
    }
  } finally { busy.hide(); }
  await deliverFile(file, blob);
}

async function buildPdfExport(doc, pages, st, Q, wm, prog) {
  const m = MARGINS[st.margin] || 0, out = [];
  for (let i = 0; i < pages.length; i++) {
    prog(i / pages.length, `Preparing page ${i + 1} of ${pages.length}…`);
    const p = pages[i], plain = !(p.marks && p.marks.length) && !wm;
    let image = null;
    if (plain && p.filter === 'bw' && p.kind !== 'id') {
      const c = await blobToCanvas(await Store.getBlob(p.proc), Q.maxDim);
      const z = await deflateBytes(await IP.run('pack1', { img: getImageData(c) }));
      if (z) image = { kind: 'bw1', data: z, pxW: c.width, pxH: c.height };
    }
    if (!image && plain && st.quality === 'high' && p.pw && p.ph) {
      image = { kind: 'jpeg', data: await blobBytes(await Store.getBlob(p.proc)), pxW: p.pw, pxH: p.ph };
    }
    if (!image) {
      const c = await renderPage(p, { maxDim: Q.maxDim, watermark: wm });
      image = { kind: 'jpeg', data: await blobBytes(await canvasToBlob(c, 'image/jpeg', Q.jpeg)), pxW: c.width, pxH: c.height };
    }
    const ar = image.pxH / image.pxW;
    let W, H, box;
    if (st.size === 'auto') {
      const w = ar >= 1 ? 595.28 : 841.89, h = w * ar;
      W = w + 2 * m; H = h + 2 * m; box = { x: m, y: m, w, h };
    } else {
      let [PW, PH] = PAGE_SIZES[st.size] || PAGE_SIZES.a4;
      if (ar < 1) [PW, PH] = [PH, PW];
      const aw = PW - 2 * m, ah = PH - 2 * m;
      let w, h;
      if (ar > ah / aw) { h = ah; w = ah / ar; } else { w = aw; h = aw * ar; }
      W = PW; H = PH; box = { x: (PW - w) / 2, y: (PH - h) / 2, w, h };
    }
    const words = [];
    if (st.searchable && p.ocr && p.ocr.words) {
      for (const wd of p.ocr.words) words.push({ s: wd.s, x: box.x + wd.x * box.w, y: box.y + (1 - wd.y - wd.h) * box.h, w: wd.w * box.w, h: wd.h * box.h });
    }
    out.push({ w: W, h: H, image, box, words });
  }
  prog(0.98, st.pw ? 'Encrypting…' : 'Writing PDF…');
  return pdfBuild(out, { title: doc.title, password: st.pw ? st.password : null });
}

// ---------------------------------------------------------------------------
// Ask Claude: summarize, translate, transcribe (incl. handwriting), Q&A, naming.
// Runs on the viewer's own Claude account through the artifact `sample` capability.
// ---------------------------------------------------------------------------
const AI_LANGS = ['English', 'Nepali', 'Hindi', 'Spanish', 'French', 'German', 'Portuguese', 'Chinese (Simplified)', 'Japanese', 'Korean', 'Arabic', 'Bengali', 'Urdu', 'Russian'];
const Assist = {
  sample: null, limits: null, checked: false,
  async init() {
    if (window.claude && typeof window.claude.use === 'function') {
      try { this.sample = await window.claude.use('sample'); } catch (e) { this.sample = null; }

    this.checked = true;
    updateAIVisibility();
  },
  get ok() { return !!this.sample; },
  get maxImages() { return (this.limits && this.limits.images && this.limits.images.maxCount) || 0; },
  errText(e) {
    switch (e && e.code) {
      case 'not_granted': case 'sampling_disabled': case 'not_declared': case 'capability_disabled': case 'capability_removed':
        this.sample = null; updateAIVisibility(); return 'Claude isn’t available for this app on your account.';
      case 'rate_limited': return e.reason === 'usage_limit' ? 'You’ve reached your Claude usage limit for now. Try again later.' : 'Too many requests at once. Wait a moment, then try again.';
      case 'session_expired': return 'Your Claude session expired. Sign in again, then retry.';
      case 'image_rejected': return 'Claude couldn’t read one of the page images.';
      case 'images_unavailable': return 'Page images can’t be sent here. Use Text first, then try again.';
      case 'prompt_too_large': return 'This document is too long to send at once. Select fewer pages.';
      case 'refused': return 'Claude declined this request.';
      case 'invalid_json': case 'empty_completion': return 'Claude didn’t return an answer. Try again.';
      case 'cancelled': return 'Stopped.';
      default: return (e && e.message && !e.code) ? e.message : 'Claude couldn’t finish. Try again.';
    }
  },
  async suggestName(doc) {
    const text = docText(doc).trim().slice(0, 3000);
    const opts = { modelTier: 'quick' };
    let prompt = 'Suggest a short, specific file name for this scanned document (2 to 6 words, no file extension; include a date or number only if it identifies the document) and pick the best folder from: Receipts, Bills, ID & Certificates, Work, School, Medical, Legal, Notes, Other. Reply with only JSON like {"title": "Electricity bill October 2026", "folder": "Bills"}.';
    if (text.length > 30) prompt += `\n\nText recognised from the document (may contain OCR errors):\n${text}`;
    else if (this.maxImages) { opts.images = [await canvasToBlob(await renderPage(doc.pages[0], { maxDim: 1400, marks: false }), 'image/jpeg', 0.8)]; prompt += '\n\nThe first page is attached as an image.'; }
    else throw new Error('Use Text on this document first, then try again.');
    const r = await this.sample.json(prompt, opts);
    if (!r || typeof r.title !== 'string') return null;
    return { title: r.title.trim().slice(0, 80), folder: typeof r.folder === 'string' ? r.folder.trim().slice(0, 40) : '' };
  },
};
function updateAIVisibility() {
  $$('.ai-only').forEach((el) => { el.hidden = !Assist.ok; });
  const n = $('#ai-note');
  if (n) { n.hidden = Assist.ok; n.textContent = Assist.checked ? 'These tools use your Claude account and aren’t available in this view.' : 'Checking whether Claude is available…'; }
}

const AI_MODES = [
  { id: 'summary', label: 'Summarize', icon: 'list' },
  { id: 'translate', label: 'Translate', icon: 'globe' },
  { id: 'extract', label: 'Transcribe', icon: 'sparkle' },
  { id: 'ask', label: 'Ask', icon: 'chat' },

function openAI(doc, mode = 'summary', pageIds = null) {
  if (!Assist.ok) { toast(Assist.checked ? 'Ask Claude isn’t available in this view.' : 'Still connecting to Claude. Try again in a moment.'); return; }
  const pages = pageIds ? doc.pages.filter((p) => pageIds.includes(p.id)) : doc.pages.slice();
  const st = { mode, lang: 'English', running: null, out: '', chat: [], status: '' };
  const s = openSheet({ title: 'Ask Claude', wide: true, onClose: () => { if (st.running) st.running.abort(); } });
  const body = s.body;
  function draw() {
    const scope = pages.length === doc.pages.length ? `All ${pages.length} ${pages.length === 1 ? 'page' : 'pages'}` : `${pages.length} of ${doc.pages.length} pages`;
    const desc = {
      summary: 'A short overview with the key names, dates, amounts and deadlines.',
      translate: 'Translates the whole document, keeping its layout.',
      extract: 'Claude reads the page images directly. Good for handwriting and mixed languages.',
      ask: 'Ask anything about this document.',
    }[st.mode];
